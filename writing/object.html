<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Writing Object — Root Logos</title>
  <link rel="icon" href="../assets/root-logos-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="object.css?v=1.1.0">
</head>
<body>
  <main>
    <canvas id="field" aria-label="A rotatable living point-cloud derived from a Root Logos writing"></canvas>
    <header>
      <a href="../#current-reading" aria-label="Return to Root Logos"><img src="../assets/root-logos-mark.svg" alt=""></a>
      <p id="work-label">Resolving</p>
    </header>
    <section class="object-copy" aria-live="polite">
      <p id="work-number">Writing object</p>
      <h1 id="work-title">The field is gathering.</h1>
      <p id="work-state">Geometry and sound remain independently versioned.</p>
    </section>
    <nav>
      <button id="sound" type="button" aria-pressed="false" hidden>Hear current sound</button>
      <a id="receipt" href="#" hidden>Inspect receipt ↗</a>
      <a id="shared" href="object.html?body=shared">Shared body ↗</a>
    </nav>
    <p class="gesture">Drag to turn · the object remains current beyond its first frame</p>
  </main>
  <script src="object.js?v=1.1.0"></script>
</body>
</html>
