name: Connected Source Integration

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  repository_dispatch:
    types:
      - foldforge-published
      - foldportrait-reflected
      - sovereign-standard-witness-published

permissions:
  contents: write
  id-token: write
  issues: write

concurrency:
  group: root-logos-source-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Root Logos
        uses: actions/checkout@v7
        with:
          path: root-logos
          fetch-depth: 0

      - name: Mint a read-only private-source token
        id: private-source-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TELOS_BRIDGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TELOS_BRIDGE_APP_PRIVATE_KEY }}
          owner: zeropoet
          repositories: |
            sovereign-standard
            FoldPortrait
          permission-contents: read

      - name: Check out canonical Sovereign Standard witness
        uses: actions/checkout@v7
        with:
          repository: zeropoet/sovereign-standard
          path: sovereign-standard
          ref: main
          fetch-depth: 1
          token: ${{ steps.private-source-token.outputs.token }}

      - name: Check out FoldForge public evidence
        uses: actions/checkout@v7
        with:
          repository: zeropoet/FoldForge
          path: FoldForge
          ref: ${{ github.event.action == 'foldforge-published' && github.event.client_payload.revision || 'main' }}
          fetch-depth: 1

      - name: Check out FoldPortrait public reflection
        uses: actions/checkout@v7
        with:
          repository: zeropoet/FoldPortrait
          path: FoldPortrait
          ref: ${{ github.event.action == 'foldportrait-reflected' && github.event.client_payload.revision || 'main' }}
          fetch-depth: 1
          token: ${{ steps.private-source-token.outputs.token }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Witness and validate source evidence
        id: source
        working-directory: root-logos
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          FOLDFORGE_REVISION: ${{ github.event.client_payload.revision }}
          FOLDFORGE_LANGUAGE_WITNESS: ${{ github.event.client_payload.language_witness }}
          FOLDFORGE_SEMANTIC_WITNESS: ${{ github.event.client_payload.semantic_witness }}
          FOLDPORTRAIT_REVISION: ${{ github.event.client_payload.revision }}
          SOVEREIGN_STANDARD_WITNESS: ${{ github.event.client_payload.witness }}
        run: |
          previous_foldforge_composition=$(node scripts/sources.mjs composition-witness sources/foldforge.snapshot.json)
          foldforge_language_source=https://foldforge.xyz/root-logos-language-composition.json
          if [ "$EVENT_ACTION" = "foldforge-published" ]; then
            node -e 'if (!/^[a-f0-9]{40}$/.test(process.env.FOLDFORGE_REVISION || "")) process.exit(1)'
            node -e 'if (!/^sha256:[a-f0-9]{64}$/.test(process.env.FOLDFORGE_LANGUAGE_WITNESS || "")) process.exit(1)'
            node -e 'if (!/^sha256:[a-f0-9]{64}$/.test(process.env.FOLDFORGE_SEMANTIC_WITNESS || "")) process.exit(1)'
            test "$(git -C ../FoldForge rev-parse HEAD)" = "$FOLDFORGE_REVISION"
            foldforge_language_source="https://foldforge.xyz/root-logos-language-composition.json?witness=${FOLDFORGE_LANGUAGE_WITNESS#sha256:}"
          fi
          node scripts/sources.mjs sync ../FoldForge "$foldforge_language_source"
          current_foldforge_composition=$(node scripts/sources.mjs composition-witness sources/foldforge.snapshot.json)
          if [ "$EVENT_ACTION" = "foldforge-published" ]; then
            test "$(node -e 'process.stdout.write(require("./sources/foldforge.snapshot.json").language_composition.semantic_witness)')" = "$FOLDFORGE_SEMANTIC_WITNESS"
          fi
          sovereign_source=../sovereign-standard/root-logos-witness-export.json
          if [ "$EVENT_ACTION" = "sovereign-standard-witness-published" ]; then
            node -e 'if (!/^sha256:[a-f0-9]{64}$/.test(process.env.SOVEREIGN_STANDARD_WITNESS || "")) process.exit(1)'
          fi
          node scripts/sources.mjs sync-sovereign-standard "$sovereign_source"
          if [ "$EVENT_ACTION" = "sovereign-standard-witness-published" ]; then
            test "$(node -e 'process.stdout.write(require("./sources/sovereign-standard.snapshot.json").witness)')" = "$SOVEREIGN_STANDARD_WITNESS"
          fi
          if [ "$EVENT_ACTION" = "foldportrait-reflected" ]; then
            node -e 'if (!/^[a-f0-9]{40}$/.test(process.env.FOLDPORTRAIT_REVISION || "")) process.exit(1)'
            test "$(git -C ../FoldPortrait rev-parse HEAD)" = "$FOLDPORTRAIT_REVISION"
          fi
          node scripts/foldportrait-source.mjs ../FoldPortrait
          node scripts/sources.mjs validate
          if git diff --quiet -- sources/foldforge.snapshot.json sources/foldportrait.snapshot.json sources/sovereign-standard.snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$previous_foldforge_composition" = "$current_foldforge_composition" ]; then
            echo "foldforge_composition_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "foldforge_composition_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Let changed evidence wake cultivation
        if: steps.source.outputs.changed == 'true'
        working-directory: root-logos
        env:
          FOLDFORGE_COMPOSITION_CHANGED: ${{ steps.source.outputs.foldforge_composition_changed }}
        run: |
          if [ "$FOLDFORGE_COMPOSITION_CHANGED" = "true" ]; then
            npm run works:recompose-foldforge
            npm run works:depth-ledger
          fi
          npm run works:check-foldforge
          node scripts/cultivate.mjs cycle
          node scripts/cultivate.mjs validate
          node scripts/attractors.mjs validate

      - name: Preserve changed witness
        if: steps.source.outputs.changed == 'true'
        id: preserve
        working-directory: root-logos
        run: |
          git config user.name "root-logos-integrator[bot]"
          git config user.email "root-logos-integrator[bot]@users.noreply.github.com"
          git add sources/foldforge.snapshot.json sources/foldportrait.snapshot.json sources/sovereign-standard.snapshot.json cultivation/state.json cultivation/memory.json cultivation/cycles content/constitutional-graph.json works/index.json works/structural-depth-migration.json works/corpora works/*/manifest.json works/*/editions
          if git diff --cached --quiet; then
            echo "Connected source evidence is unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          witness=$(node -e 'const f=require("./sources/foldforge.snapshot.json"); const p=require("./sources/foldportrait.snapshot.json"); const s=require("./sources/sovereign-standard.snapshot.json"); process.stdout.write(`${f.witness.slice(7,13)}-${p.witness.slice(7,13)}-${s.witness.slice(7,13)}`)')
          git commit -m "Witness connected sources (${witness})"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Main advanced during integration; rebasing attempt ${attempt}/4."
            git pull --rebase origin main
          done
          echo "Unable to converge Root Logos after four push attempts."
          exit 1

      - name: Mint a connected-system propagation token
        if: steps.preserve.outputs.changed == 'true'
        id: connected-system-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TELOS_BRIDGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TELOS_BRIDGE_APP_PRIVATE_KEY }}
          owner: zeropoet
          repositories: |
            Telos
            FoldPortrait
          permission-contents: write

      - name: Propagate the automated Root Logos commit
        if: steps.preserve.outputs.changed == 'true'
        working-directory: root-logos
        env:
          CONNECTED_SYSTEM_TOKEN: ${{ steps.connected-system-token.outputs.token }}
          SOURCE_SHA: ${{ steps.preserve.outputs.revision }}
          SOURCE_EVENT_ACTION: ${{ github.event.action }}
        run: |
          occurred_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          telos_payload=$(jq -n \
            --arg source_repository "zeropoet/root-logos" \
            --arg source_sha "$SOURCE_SHA" \
            --arg change_class "relation" \
            --arg summary "Root Logos preserved its current constitutional and connected-source relation map." \
            --arg witness_url "https://rootlogos.com/" \
            --arg occurred_at "$occurred_at" \
            '{event_type:"telos-propagation",client_payload:{source_repository:$source_repository,source_sha:$source_sha,change_class:$change_class,summary:$summary,witness_url:$witness_url,occurred_at:$occurred_at}}')
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 3 \
            -X POST https://api.github.com/repos/zeropoet/Telos/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $CONNECTED_SYSTEM_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$telos_payload"
          if [ "$SOURCE_EVENT_ACTION" = "foldportrait-reflected" ]; then
            echo "FoldPortrait-originated evidence was witnessed by Root Logos; suppressing the return wake."
            exit 0
          fi
          foldportrait_payload=$(jq -n \
            --arg source_repository "zeropoet/root-logos" \
            --arg source_sha "$SOURCE_SHA" \
            '{event_type:"connected-system-changed",client_payload:{source_repository:$source_repository,source_sha:$source_sha}}')
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 3 \
            -X POST https://api.github.com/repos/zeropoet/FoldPortrait/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $CONNECTED_SYSTEM_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$foldportrait_payload"

      - name: Report source propagation failure
        if: failure()
        working-directory: root-logos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Connected-source propagation failure"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "A FoldForge, FoldPortrait, or Sovereign Standard source integration failed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
