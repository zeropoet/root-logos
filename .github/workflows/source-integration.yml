name: Connected Source Integration

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  repository_dispatch:
    types:
      - foldforge-published
      - foldportrait-reflected
      - sovereign-standard-witness-published

permissions:
  contents: write

concurrency:
  group: root-logos-source-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Root Logos
        uses: actions/checkout@v7
        with:
          path: root-logos
          fetch-depth: 0

      - name: Check out FoldForge public evidence
        uses: actions/checkout@v7
        with:
          repository: zeropoet/FoldForge
          path: FoldForge
          ref: ${{ github.event.action == 'foldforge-published' && github.event.client_payload.revision || 'main' }}
          fetch-depth: 1

      - name: Check out FoldPortrait public reflection
        uses: actions/checkout@v7
        with:
          repository: zeropoet/FoldPortrait
          path: FoldPortrait
          ref: ${{ github.event.action == 'foldportrait-reflected' && github.event.client_payload.revision || 'main' }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Witness and validate source evidence
        id: source
        working-directory: root-logos
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          FOLDFORGE_REVISION: ${{ github.event.client_payload.revision }}
          FOLDFORGE_LANGUAGE_WITNESS: ${{ github.event.client_payload.language_witness }}
          FOLDFORGE_SEMANTIC_WITNESS: ${{ github.event.client_payload.semantic_witness }}
          FOLDPORTRAIT_REVISION: ${{ github.event.client_payload.revision }}
          SOVEREIGN_STANDARD_WITNESS: ${{ github.event.client_payload.witness }}
        run: |
          previous_foldforge_composition=$(node scripts/sources.mjs composition-witness sources/foldforge.snapshot.json)
          foldforge_language_source=https://foldforge.xyz/root-logos-language-composition.json
          if [ "$EVENT_ACTION" = "foldforge-published" ]; then
            node -e 'if (!/^[a-f0-9]{40}$/.test(process.env.FOLDFORGE_REVISION || "")) process.exit(1)'
            node -e 'if (!/^sha256:[a-f0-9]{64}$/.test(process.env.FOLDFORGE_LANGUAGE_WITNESS || "")) process.exit(1)'
            node -e 'if (!/^sha256:[a-f0-9]{64}$/.test(process.env.FOLDFORGE_SEMANTIC_WITNESS || "")) process.exit(1)'
            test "$(git -C ../FoldForge rev-parse HEAD)" = "$FOLDFORGE_REVISION"
            foldforge_language_source="https://foldforge.xyz/root-logos-language-composition.json?witness=${FOLDFORGE_LANGUAGE_WITNESS#sha256:}"
          fi
          node scripts/sources.mjs sync ../FoldForge "$foldforge_language_source"
          current_foldforge_composition=$(node scripts/sources.mjs composition-witness sources/foldforge.snapshot.json)
          if [ "$EVENT_ACTION" = "foldforge-published" ]; then
            test "$(node -e 'process.stdout.write(require("./sources/foldforge.snapshot.json").language_composition.semantic_witness)')" = "$FOLDFORGE_SEMANTIC_WITNESS"
          fi
          sovereign_source=https://sovereignstandard.co/root-logos-witness-export.json
          if [ "$EVENT_ACTION" = "sovereign-standard-witness-published" ]; then
            node -e 'if (!/^sha256:[a-f0-9]{64}$/.test(process.env.SOVEREIGN_STANDARD_WITNESS || "")) process.exit(1)'
            sovereign_source="https://raw.githubusercontent.com/zeropoet/sovereign-standard-site/main/root-logos-witness-export.json?witness=${SOVEREIGN_STANDARD_WITNESS#sha256:}"
          fi
          node scripts/sources.mjs sync-sovereign-standard "$sovereign_source"
          if [ "$EVENT_ACTION" = "foldportrait-reflected" ]; then
            node -e 'if (!/^[a-f0-9]{40}$/.test(process.env.FOLDPORTRAIT_REVISION || "")) process.exit(1)'
            test "$(git -C ../FoldPortrait rev-parse HEAD)" = "$FOLDPORTRAIT_REVISION"
          fi
          node scripts/foldportrait-source.mjs ../FoldPortrait
          node scripts/sources.mjs validate
          if git diff --quiet -- sources/foldforge.snapshot.json sources/foldportrait.snapshot.json sources/sovereign-standard.snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$previous_foldforge_composition" = "$current_foldforge_composition" ]; then
            echo "foldforge_composition_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "foldforge_composition_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Let changed evidence wake cultivation
        if: steps.source.outputs.changed == 'true'
        working-directory: root-logos
        env:
          FOLDFORGE_COMPOSITION_CHANGED: ${{ steps.source.outputs.foldforge_composition_changed }}
        run: |
          if [ "$FOLDFORGE_COMPOSITION_CHANGED" = "true" ]; then
            npm run works:recompose-foldforge
          fi
          npm run works:check-foldforge
          node scripts/cultivate.mjs cycle
          node scripts/cultivate.mjs validate
          node scripts/attractors.mjs validate

      - name: Preserve changed witness
        if: steps.source.outputs.changed == 'true'
        working-directory: root-logos
        run: |
          git config user.name "root-logos-integrator[bot]"
          git config user.email "root-logos-integrator[bot]@users.noreply.github.com"
          git add sources/foldforge.snapshot.json sources/foldportrait.snapshot.json sources/sovereign-standard.snapshot.json cultivation/state.json cultivation/memory.json cultivation/cycles content/constitutional-graph.json works/index.json works/corpora works/*/manifest.json works/*/editions
          if git diff --cached --quiet; then
            echo "Connected source evidence is unchanged."
            exit 0
          fi
          witness=$(node -e 'const f=require("./sources/foldforge.snapshot.json"); const p=require("./sources/foldportrait.snapshot.json"); const s=require("./sources/sovereign-standard.snapshot.json"); process.stdout.write(`${f.witness.slice(7,13)}-${p.witness.slice(7,13)}-${s.witness.slice(7,13)}`)')
          git commit -m "Witness connected sources (${witness})"
          git push origin HEAD:main

      - name: Converge the always-awake runtime
        if: steps.source.outputs.changed == 'true'
        working-directory: root-logos
        env:
          DEPLOY_TOKEN: ${{ secrets.ROOT_LOGOS_DEPLOY_TOKEN }}
        run: |
          test -n "$DEPLOY_TOKEN"
          commit_sha=$(git rev-parse HEAD)
          curl --fail --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 3 \
            -X POST https://runtime.rootlogos.com/v1/internal/deploy \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "X-GitHub-SHA: $commit_sha" \
            -H "Content-Type: application/json" \
            --data '{}'
