name: Deploy Root Logos Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Cultivation Chamber", "Connected Source Integration"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: root-logos-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out public archive
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload public archive
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy public archive
        id: deployment
        uses: actions/deploy-pages@v5
