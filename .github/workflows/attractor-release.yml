name: Attractor Release

on:
  schedule:
    - cron: "17 10 * * 1,3,5"
      timezone: "America/New_York"
    - cron: "47 13 * * 1,3,5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      operation:
        description: "Verify credentials without posting, or run the release cycle"
        required: true
        default: "verify"
        type: choice
        options:
          - verify
          - release

permissions:
  contents: write
  actions: write

concurrency:
  group: attractor-release
  cancel-in-progress: false

jobs:
  emit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      X_USER_ACCESS_TOKEN: ${{ secrets.X_USER_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Converge on current main before release
        if: github.event_name == 'schedule' || inputs.operation == 'release'
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate constitutional and attractor state
        run: node scripts/attractors.mjs validate

      - name: Emit the next constitutionally eligible fragment
        if: github.event_name == 'schedule' || inputs.operation == 'release'
        run: node scripts/attractors.mjs release-x

      - name: Verify authenticated X identity without posting
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'verify'
        run: node scripts/attractors.mjs verify-x

      - name: Preserve emission provenance
        id: preserve
        if: github.event_name == 'schedule' || inputs.operation == 'release'
        run: |
          if git diff --quiet -- content/attractor-packets.json; then
            echo "No eligible fragment was emitted."
            echo "emitted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "root-logos-attractor"
          git config user.email "root-logos-attractor@users.noreply.github.com"
          git add content/attractor-packets.json
          git commit -m "Archive attractor emission"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "emitted=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Emission receipt push raced with another update; retrying ($attempt/3)."
          done
          echo "Unable to preserve the emission receipt after three rebased attempts."
          exit 1

      - name: Ripple published fragment through Root Logos
        if: steps.preserve.outputs.emitted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in pages.yml cultivation-cycle.yml; do
            dispatched=false
            for attempt in 1 2 3; do
              if gh workflow run "$workflow" --ref main; then
                dispatched=true
                break
              fi
              sleep $((attempt * 2))
            done
            if [ "$dispatched" != "true" ]; then
              echo "Unable to dispatch $workflow after three attempts."
              exit 1
            fi
          done
