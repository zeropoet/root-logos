name: One-Time Lightsail Credential Migration

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Transfer X publication authority to Lightsail
        env:
          OIDC_AUDIENCE: ${{ vars.ROOT_LOGOS_OIDC_AUDIENCE }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          test -n "$OIDC_AUDIENCE"
          payload_path="$(mktemp)"
          trap 'rm -f "$payload_path"' EXIT
          node -e '
            const fs = require("fs");
            const fields = ["X_API_KEY", "X_API_SECRET", "X_ACCESS_TOKEN", "X_ACCESS_TOKEN_SECRET"];
            if (fields.some((field) => !process.env[field])) process.exit(1);
            fs.writeFileSync(process.argv[1], JSON.stringify(Object.fromEntries(fields.map((field) => [field, process.env[field]]))), { mode: 0o600 });
          ' "$payload_path"
          oidc_response=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")
          oidc_token=$(printf '%s' "$oidc_response" | jq -er '.value')
          curl --fail --silent --show-error \
            -X POST https://runtime.rootlogos.com/v1/internal/migrate-x-credentials \
            -H "Authorization: Bearer $oidc_token" \
            -H "X-GitHub-SHA: $GITHUB_SHA" \
            -H "Content-Type: application/json" \
            --data-binary "@$payload_path"
