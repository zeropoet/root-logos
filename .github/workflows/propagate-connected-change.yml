name: Propagate Root Logos Change

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-logos-connected-propagation
  cancel-in-progress: false

jobs:
  propagate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint a connected-system dispatch token
        id: connected-system-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TELOS_BRIDGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TELOS_BRIDGE_APP_PRIVATE_KEY }}
          owner: zeropoet
          repositories: |
            Telos
            FoldPortrait
          permission-contents: write

      - name: Propagate Root Logos to Telos
        env:
          CONNECTED_SYSTEM_TOKEN: ${{ steps.connected-system-token.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          occurred_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          payload=$(jq -n \
            --arg source_repository "zeropoet/root-logos" \
            --arg source_sha "$SOURCE_SHA" \
            --arg change_class "relation" \
            --arg summary "Root Logos preserved its current constitutional and connected-source relation map." \
            --arg witness_url "https://rootlogos.com/" \
            --arg occurred_at "$occurred_at" \
            '{event_type:"telos-propagation",client_payload:{source_repository:$source_repository,source_sha:$source_sha,change_class:$change_class,summary:$summary,witness_url:$witness_url,occurred_at:$occurred_at}}')
          curl --fail --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 3 \
            -X POST https://api.github.com/repos/zeropoet/Telos/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $CONNECTED_SYSTEM_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$payload"

      - name: Wake FoldPortrait from the Root Logos change
        env:
          CONNECTED_SYSTEM_TOKEN: ${{ steps.connected-system-token.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          payload=$(jq -n \
            --arg source_repository "zeropoet/root-logos" \
            --arg source_sha "$SOURCE_SHA" \
            '{event_type:"connected-system-changed",client_payload:{source_repository:$source_repository,source_sha:$source_sha}}')
          curl --fail --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 3 \
            -X POST https://api.github.com/repos/zeropoet/FoldPortrait/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $CONNECTED_SYSTEM_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$payload"
